apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ghost
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.domain }}`) || Host(`www.{{ .Values.domain }}`)
      kind: Rule
      services:
        - name: ghost
          port: 80
  tls:
    secretName: ghost-tls
