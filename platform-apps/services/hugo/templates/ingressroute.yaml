apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hugo
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.domain }}`)
      kind: Rule
      services:
        - name: hugo
          port: 80
  tls:
    secretName: hugo-tls
